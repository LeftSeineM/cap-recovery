<!doctype html><meta charset="utf-8"><title>Step 搜索树</title>
<style>
:root{font:14px system-ui;color:#dbe3ef;background:#111827}body{margin:0}header{padding:16px;border-bottom:1px solid #374151}h1{font-size:20px;margin:0 0 8px}main{display:grid;grid-template-columns:55% 45%;height:calc(100vh - 85px)}#canvas{overflow:auto}svg{min-width:100%;height:auto}.node,.edge{cursor:pointer}.node:hover circle{stroke:white;stroke-width:3}text{fill:#dbe3ef;font-size:12px}aside{overflow:auto;padding:16px;border-left:1px solid #374151}video,img{width:100%;max-height:48vh;object-fit:contain;background:#030712}pre{white-space:pre-wrap;word-break:break-word;font:12px ui-monospace;line-height:1.5}button{background:#334155;color:white;border:1px solid #64748b;border-radius:4px;padding:5px 9px;cursor:pointer}.legend span{margin-right:16px}.success{color:#94a3b8}.a2{color:#fbbf24}.hint{color:#94a3b8}details{margin-top:12px}summary{cursor:pointer}#empty{padding:30px}
</style>
<header><h1>Step 搜索树 <small id="seed"></small></h1><div class="legend"><span class="success">● 正常动作</span><span class="a2">● a2 原地恢复</span><span>虚线：回滚；被弃分支标注“规划”/“物理”</span></div></header>
<main><div id="canvas"><svg id="tree"></svg></div><aside><p class="hint">点击状态看图片，点击动作播放片段。所有媒体均使用相对路径，页面可离线打开。</p><h2 id="title">选择节点或动作</h2><img id="still" hidden><video id="clip" controls hidden></video><p id="missing" class="hint"></p><details id="rejects" hidden><summary>失败原因与求解参数</summary><pre id="reasons"></pre></details><pre id="detail"></pre></aside></main>
<script>
const data=SEARCH_DATA,NS='http://www.w3.org/2000/svg',svg=document.querySelector('#tree'),colors={a2:'#fbbf24'};
document.querySelector('#seed').textContent='seed '+data.seed+(data.repeat===null?'':' · repeat '+data.repeat)+' · '+['a1','a2','a3','b'].map(c=>c+' '+(data.failure_counts[c]||0)).join(' / ');
const branches=[...new Set(data.nodes.map(n=>n.branch))],positions={};let height=120;
branches.forEach((b,i)=>{const nodes=data.nodes.filter(n=>n.branch===b).sort((a,b)=>a.at-b.at);nodes.forEach((n,j)=>{positions[n.id]=[110+i*230,65+j*95];height=Math.max(height,110+j*95)});});
svg.setAttribute('viewBox',`0 0 ${Math.max(600,branches.length*230+100)} ${height}`);
function el(tag,attrs,parent=svg){let x=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));parent.append(x);return x}
function choose(item,node){document.querySelector('#title').textContent=node?'状态 '+item.at+' · '+item.branch:item.name+' · '+item.category;const still=document.querySelector('#still'),clip=document.querySelector('#clip'),missing=document.querySelector('#missing');clip.pause();still.hidden=!node;clip.hidden=node;missing.textContent='';if(node){still.src=`media/stills/${item.media}.jpg`;still.onerror=()=>{still.hidden=true;missing.textContent='图片尚未生成：渲染 media 批次后运行 thumbnails。'};}else{clip.src=`media/videos/${item.media}/merge.mp4`;clip.onerror=()=>missing.textContent='视频尚未生成：请用 render.py 渲染 media 批次。';}const rejects=document.querySelector('#rejects');rejects.hidden=!(node&&item.failures.length);rejects.open=node&&item.failures.length>0;document.querySelector('#reasons').textContent=JSON.stringify(item.failures,null,2);document.querySelector('#detail').textContent=JSON.stringify(item,null,2);}
for(const edge of data.edges){const a=positions[edge.source],b=positions[edge.target];if(!a||!b)continue;const group=el('g',{class:'edge'});el('path',{d:`M${a[0]},${a[1]+14} L${b[0]},${b[1]-14}`,stroke:colors[edge.category]||'#94a3b8',fill:'none','stroke-width':5,'stroke-dasharray':edge.category==='rollback'?'7 5':'none'},group);let t=el('text',{x:(a[0]+b[0])/2+8,y:(a[1]+b[1])/2},group);t.textContent=edge.name;group.onclick=()=>choose(edge,false);}
for(const node of data.nodes){const [x,y]=positions[node.id],group=el('g',{class:'node'});el('circle',{cx:x,cy:y,r:15,fill:'#1e3a5f',stroke:'#60a5fa','stroke-width':2},group);let t=el('text',{x:x-32,y:y-25},group);t.textContent='frame '+node.at;group.onclick=()=>choose(node,true);if(node.terminal){let label=el('text',{x:x+18,y:y-8},group);label.textContent=node.terminal;}}
if(!data.nodes.length)document.querySelector('#canvas').textContent='没有执行动作或规划拒绝记录。';
</script>
